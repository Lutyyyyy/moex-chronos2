# Path B — DAILY (1d / interval 24) pipeline-test config.
# Mirrors path_b_60m (universe, horizon 3, eval [1,2,3]) but at interval 24.
# WHY daily: at interval==24 the panel uses a regular business-day index (asfreq("B")),
# avoiding the irregular intraday session grid (10:00-18:50) that breaks AutoGluon's
# index alignment at 60m. This validates the Path B pipeline end-to-end on a clean freq.
stage_id: path_b_1d_ctx250
notes: >
  Path B (AutoGluon Chronos-2) at DAILY interval. Regular business-day index.
  Horizons [1,2,3], prediction_length=3. Pipeline-validation config.

interval: 24
# NOTE: date range must MATCH the daily *_24_* parquet filenames already in moex_cache,
# or the cache-only loader will CacheMiss. Adjust if your daily files use a different range.
date_from: "2023-01-01"
date_till: "2026-04-30"

tickers:
  - SBER
  - GAZP
  - LKOH
  - ROSN
  - NVTK
  - TATN
  - GMKN
  - PLZL
  - MAGN
  - NLMK
  - MOEX
  - VTBR

indexes:        [IMOEX, MOEXOG, MOEXMM, MOEXFN]
futures_proxies: [BR, Si, GD]

context_len: 128           # 250~1 year of business days (Path A daily used 250)
horizon: 3                 # Path B prediction_length
quantiles: [0.1, 0.5, 0.9]

walk_forward:
  shift: 1                 # daily: shift 1 business day per window
  max_windows: 200

covariates: full

eval_horizons:    [1, 2, 3]
primary_horizons: [1, 2, 3]
baselines: [zero, last, momentum5, ar1]

output_dir: runs            # Path A key (required by load_config); Path B uses path_b.output_root
seed: 42

path_b:
  enabled: true
  output_root: runs/path_b
  scratchpad_root: scratchpads/path_b
  current_state_path: current_state.md
  intervals_to_test: [24]
  prediction_length: 3
  eval_horizons: [1, 2, 3]
  primary_horizons: [1, 2, 3]
  cross_learning_main: true
  cross_learning_diagnostics: false
  num_val_windows: 3
  refit_every_n_windows: 1
  model_path: "amazon/chronos-2"
  chronos2_batch_size: 64
  enable_ensemble: false
  eval_metric: WQL
