# Stage 1 — daily interval, full Path A study
# Run 4 sub-variants by editing context_len + stage_id: 1a=64, 1b=128, 1c=250, 1d=500
stage_id: stage_1c_daily_ctx250
notes: >
  Daily, core 12, full date range, walk-forward >=200 windows.
  Per-cell DA + binomial p (BH-corrected). Context grid sweep done by editing
  stage_id + context_len and re-running.

interval: 24
date_from: "2021-01-01"
date_till: "2026-04-30"

tickers:
  - SBER
  - GAZP
  - LKOH
  - ROSN
  - NVTK
  - TATN
  - GMKN
  - PLZL
  - MAGN
  - NLMK
  - MOEX
  - VTBR

indexes:        [IMOEX, MOEXOG, MOEXMM, MOEXFN, RGBI]
futures_proxies: [BR, Si, GD]

context_len: 250           # also run with 64, 128, 500
horizon: 5
quantiles: [0.1, 0.5, 0.9]

walk_forward:
  shift: 1
  max_windows: 400         # cap at 400; ~200 minimum acceptable

covariates: full

eval_horizons:    [1, 2, 3, 5]
primary_horizons: [2, 3, 5]
baselines: [zero, last, momentum5, ar1]

output_dir: runs
