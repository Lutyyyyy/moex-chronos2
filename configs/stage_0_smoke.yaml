# Stage 0 — smoke / pipeline validation
stage_id: stage_0_smoke
notes: >
  Short window, daily, core 12. Goal: pipeline runs end-to-end, cache populated,
  output schema readable by downstream stages. No statistical claim.

interval: 24                # 10 / 60 / 24
date_from: "2024-01-01"
date_till: "2024-06-30"

tickers:
  - SBER
  - GAZP
  - LKOH
  - ROSN
  - NVTK
  - TATN
  - GMKN
  - PLZL
  - MAGN
  - NLMK
  - MOEX
  - VTBR

indexes:        [IMOEX, MOEXOG, MOEXMM, MOEXFN, RGBI]
futures_proxies: [BR, Si, GD]   # FORTS roots; resolved per-bar by section 4b in basic_cells.ipynb

context_len: 250
horizon: 5
quantiles: [0.1, 0.5, 0.9]

walk_forward:
  shift: 1
  max_windows: 40

covariates: full             # full / market_only / calendar_only / none

eval_horizons:    [1, 2, 3, 5]
primary_horizons: [2, 3, 5]
baselines: [zero, last, momentum5, ar1]

output_dir: runs
