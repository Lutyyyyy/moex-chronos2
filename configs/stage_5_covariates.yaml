# Stage 5 — Covariate ablation
# 4 sub-variants by changing `covariates` + `stage_id`: 5a=none, 5b=calendar_only, 5c=market_only, 5d=full
stage_id: stage_5a_none
notes: >
  Isolate which covariate family carries signal. Same (interval, ctx, universe)
  as the best stage 1-3 sub-run. Report Delta DA / Delta corr from 5a.

interval: 24                  # mirror best interval from stages 1-3
date_from: "2021-01-01"
date_till: "2026-04-30"

tickers:
  - SBER
  - GAZP
  - LKOH
  - ROSN
  - NVTK
  - TATN
  - GMKN
  - PLZL
  - MAGN
  - NLMK
  - MOEX
  - VTBR

indexes:        [IMOEX, MOEXOG, MOEXMM, MOEXFN, RGBI]
futures_proxies: [BR, Si, GD]

context_len: 250              # mirror best ctx
horizon: 5
quantiles: [0.1, 0.5, 0.9]

walk_forward:
  shift: 1
  max_windows: 400

covariates: none              # 5a=none, 5b=calendar_only, 5c=market_only, 5d=full

eval_horizons:    [1, 2, 3, 5]
primary_horizons: [2, 3, 5]
baselines: [zero, last, momentum5, ar1]

output_dir: runs
