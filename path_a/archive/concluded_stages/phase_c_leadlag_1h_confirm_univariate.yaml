# Phase C (1h follow-on) — univariate-with-covariates arm
# Companion to phase_c_leadlag_1h_confirm.yaml (multivariate, GATE FAILED, 0/13 pairs
# -- see path_a/scratchpads/phase_c_1h_scratch_pad.md). NOT a re-run of that test: this
# arm asks a narrower, different question, raised explicitly by the user after seeing
# the multivariate result.
#
# Question: can Chronos-2 extract SOME of what made these specific 16 tickers show
# pairwise correlation in discovery through the COVARIATE panel alone (IMOEX, sector
# indexes, futures, calendar), with cross_learning=False (no direct attention across
# the 16 tickers)? Phase B's univariate arm already tested "covariates alone, general
# ticker sample" and got a null (DA~0.484) -- but Phase B's 16 tickers were a
# sector-stratified sample chosen for coverage, not for any known pairwise
# relationship. This arm reuses the SAME 16 tickers Phase C's lead-lag screen flagged
# as correlated, so it's a genuinely different test: if any of what drove their
# discovery-phase correlation is mediated by a shared covariate (e.g. a sector index
# both tickers load on), a univariate model with that covariate available might catch
# a fragment of it even though the multivariate (cross-attention) arm caught nothing.
#
# Identical to phase_c_leadlag_1h_confirm.yaml in every field except group_mode --
# same tickers/dates/covariates/context_len/windows, so results are directly
# comparable pair-by-pair against that run's metrics.csv. Mirror any non-group_mode
# edit into both configs.
stage_id: phase_c_leadlag_1h_confirm_univariate
notes: >
  1h-resolution lead-lag confirmation, univariate-with-covariates arm. Does
  Chronos-2 (cross_learning=False, covariates=full) show any predictive skill
  on the 16 tickers flagged by the 1h discovery screen, using covariates as
  the only cross-series information channel (no direct multivariate
  attention across these tickers)? Companion to the multivariate confirmation
  arm, which GATE FAILED (0/13 pairs). Same per-pair BH-within-family
  criterion, computed post-hoc same as the multivariate arm.

data_source: algopack
algopack_processed_path: algo_data/data/processed/candles_1h/shares.parquet
min_ticker_coverage: 0.9

group_mode: univariate

interval: 60
date_from: "2024-05-27"
date_till: "2024-12-30"

tickers:
  # Identical set to phase_c_leadlag_1h_confirm.yaml -- see that file's comment for
  # provenance (union of the 13 BH-significant 1h discovery hypotheses).
  - BANEP
  - CHMF
  - FESH
  - HYDR
  - MGNT
  - MRKC
  - MTLR
  - MTLRP
  - MTSS
  - NMTP
  - SBER
  - SBERP
  - SNGSP
  - UPRO
  - VSMO
  - VTBR

indexes:        [IMOEX, MOEXOG, MOEXMM, MOEXFN, RGBI]
futures_proxies: [BR, Si, GD]

context_len: 250
horizon: 5
quantiles: [0.1, 0.5, 0.9]

walk_forward:
  shift: 1
  max_windows: 400

covariates: full

eval_horizons:    [1, 2, 3, 5]
primary_horizons: [2, 3, 5]
baselines: [zero, last, momentum5, ar1]

output_dir: runs
