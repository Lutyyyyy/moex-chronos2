# Phase B — univariate arm of the multivariate-vs-univariate gate
# Pair with phase_b_multivariate.yaml: identical in every field except group_mode.
# The gate's stopping rule (paired McNemar test on directional hit/miss per
# (ticker, horizon, window), BH-corrected) needs the two arms run on the SAME
# windows/tickers/covariates — do not edit context_len/tickers/date range in one
# without mirroring it in the other.
stage_id: phase_b_univariate
notes: >
  Phase B gate (pivot rev. 2): does grouping many series for Chronos-2 to
  forecast JOINTLY (cross_learning=True) beat forecasting each independently
  (cross_learning=False, this arm)? This is also the closest re-run to Stage
  2b/prior Path A stages, none of which ever set cross_learning=True — so this
  arm is the "no change" baseline, and phase_b_multivariate is the one new
  condition being tested. Gate passes iff aggregate ΔDA > 0 AND ≥1
  BH-significant cell favoring multivariate AND multivariate still beats
  baselines. Gate fails → Phase C (lead-lag screening) is not funded; write up
  as a negative result, stop.
  16 tickers survive algo_data's real 2020-2024 pull after build_price_panel's
  coverage guard drops 6 short-history/recent-listing tickers (see
  algo_data/current_state.md session log, 2026-09-17).

data_source: algopack
algopack_processed_path: algo_data/data/processed/candles_1d/shares.parquet
min_ticker_coverage: 0.9

group_mode: univariate

interval: 24
date_from: "2020-01-03"
date_till: "2024-12-30"

tickers:
  - GAZP
  - SMLT
  - SBER
  - ROSN
  - MTSS
  - LKOH
  - T
  - OZON
  - PLZL
  - VTBR
  - YDEX
  - VKCO
  - GMKN
  - MAGN
  - AFKS
  - MGNT
  - PHOR
  - AFLT
  - IRAO
  - FEES
  - MDMG
  - LENT
  # 22 configured; min_ticker_coverage=0.9 drops LENT/MDMG/OZON/SMLT/VKCO/YDEX
  # at build_price_panel time (verified 2026-09-17 against the real pull) —
  # left in the config rather than pre-trimmed so a coverage-threshold change
  # picks them back up automatically; final panel is ~16 tickers.

indexes:        [IMOEX, MOEXOG, MOEXMM, MOEXFN, RGBI]
futures_proxies: [BR, Si, GD]

context_len: 250
horizon: 5
quantiles: [0.1, 0.5, 0.9]

walk_forward:
  shift: 1
  max_windows: 400

covariates: full

eval_horizons:    [1, 2, 3, 5]
primary_horizons: [2, 3, 5]
baselines: [zero, last, momentum5, ar1]

output_dir: runs
