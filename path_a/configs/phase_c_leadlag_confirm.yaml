# Phase C3 — confirmation arm of the lead-lag screen
# Runs Chronos-2 (group_mode: multivariate) ONLY on the tickers that appear in
# Phase C2's discovery-phase shortlist (select_pair_shortlist output, BH q<0.05,
# top_n=20 cap) — not the full 80-ticker universe. Confirmation window is
# strictly AFTER the discovery window (no date overlap) so this is a genuine
# out-of-sample test of whatever pairs discovery flagged, not a re-fit.
#
# BEFORE RUNNING: fill in `tickers:` below with the union of ticker_i/ticker_j
# from the discovery shortlist (see path_a/scratchpads/phase_c_scratch_pad.md
# for the pre-registered discovery/confirmation date split and the actual
# shortlist once basic_cells.ipynb §14 has been run). If the shortlist is
# empty, do not run this config — 0 survivors is a valid, complete result on
# its own; write it up instead (see the plan's decision 5).
stage_id: phase_c_leadlag_confirm
notes: >
  Phase C confirmation: does Chronos-2 (cross_learning=True) show real
  predictive skill, out-of-sample, on the specific ticker pairs that Phase
  C2's discovery-phase lead-lag screen flagged as BH-significant (q<0.05,
  top-20 cap if oversubscribed)? Per-pair success requires the pair's cells
  to be BH-significant WITHIN this confirmation run's own test family (not
  reusing discovery p-values) AND beat the `last` baseline — mirrors Phase
  B's three-part gate shape (ΔDA>0 AND significant AND beats-baseline),
  applied per pair instead of per basket-average.

data_source: algopack
algopack_processed_path: algo_data/data/processed/candles_1d/shares.parquet
min_ticker_coverage: 0.9

group_mode: multivariate

interval: 24
# Confirmation window: strictly after the discovery window used in Phase C2's
# pairwise_lagged_xcorr (mid-2023 -> 2024-12-30, ~390 calendar days per the
# pre-registered 70/30 split). Update BOTH this config and the discovery cell
# together if the split ever changes -- they must not overlap.
date_from: "2023-07-01"
date_till: "2024-12-30"

tickers:
  # PLACEHOLDER -- replace with the union of ticker_i/ticker_j from Phase C2's
  # select_pair_shortlist() output before running. Example shape (do not use
  # as-is):
  # - GAZP
  # - SBER
  []

indexes:        [IMOEX, MOEXOG, MOEXMM, MOEXFN, RGBI]
futures_proxies: [BR, Si, GD]

context_len: 250
horizon: 5
quantiles: [0.1, 0.5, 0.9]

walk_forward:
  shift: 1
  max_windows: 400

covariates: full

eval_horizons:    [1, 2, 3, 5]
primary_horizons: [2, 3, 5]
baselines: [zero, last, momentum5, ar1]

output_dir: runs
