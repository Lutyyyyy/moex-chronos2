# Phase B, close_adj follow-on — 1h, univariate arm
# Mirrors basket_gate_1h_adj_multivariate.yaml exactly except group_mode. See that file's
# header for the full rationale (first 1h run of the Phase B gate itself, date range
# reused from Phase C's validated 1h confirmation window).
stage_id: basket_gate_1h_adj_univariate
notes: >
  Phase B gate, 1h + close_adj: univariate arm (cross_learning=False), paired
  against basket_gate_1h_adj_multivariate for the McNemar gate test.

data_source: algopack
algopack_processed_path: data_pipeline/data/processed/candles_1h/shares.parquet
price_col: close_adj
min_ticker_coverage: 0.9

group_mode: univariate

interval: 60
date_from: "2024-05-27"
date_till: "2024-12-30"

tickers:
  - GAZP
  - SMLT
  - SBER
  - ROSN
  - MTSS
  - LKOH
  - T
  - OZON
  - PLZL
  - VTBR
  - YDEX
  - VKCO
  - GMKN
  - MAGN
  - AFKS
  - MGNT
  - PHOR
  - AFLT
  - IRAO
  - FEES
  - MDMG
  - LENT
  # See basket_gate_1h_adj_multivariate.yaml for the coverage-guard note -- do not assume
  # the daily drop list applies on this shorter 217-day window.

indexes:        [IMOEX, MOEXOG, MOEXMM, MOEXFN, RGBI]
futures_proxies: [BR, Si, GD]

context_len: 250
horizon: 5
quantiles: [0.1, 0.5, 0.9]

walk_forward:
  shift: 1
  max_windows: 400

covariates: full

eval_horizons:    [1, 2, 3, 5]
primary_horizons: [2, 3, 5]
baselines: [zero, last, momentum5, ar1]

output_dir: runs
