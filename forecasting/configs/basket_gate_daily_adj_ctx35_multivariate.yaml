# CTX35 VARIANT: identical to basket_gate_daily_adj_multivariate.yaml except context_len: 35 (was 250). New experiment,
# not a fix -- tests whether a short (~7 trading week, same bar count at daily and 1h
# per user's explicit choice 2026-09-17) locally-relevant context changes results vs
# the full ~1-year context used everywhere else in this project. Motivated by user's
# observation that some daily heatmap cells looked deceptively good despite a
# seemingly-irrelevant year of lookback for a 5-day-ahead call (verified: those cells,
# e.g. phase_c_leadlag_confirm's UNAC/IRKT, do NOT survive BH correction -- p_binom_bh
# >=0.34 despite raw p as low as 0.005 -- confirming the concern was worth investigating,
# not confirming those specific cells were real). Existing (already-cached) date ranges
# give far more than max_windows=400 scorable windows even at context_len=35 (verified:
# 1262 for the daily range, 1208 for the 1h range), so no new date range is needed --
# every other field is unchanged from basket_gate_daily_adj_multivariate.yaml.
#
# Phase B, close_adj follow-on — daily, multivariate arm
# Closes out the daily/1h leg of the close_adj rollout (see docs/current_state.md,
# 2026-09-17 session): the original phase_b_multivariate.yaml (archive/concluded_stages/)
# ran on raw `close` and FAILED. This is a full fresh rerun of the identical gate, same
# tickers/context_len/horizon/windows/date range, differing ONLY in price_col: close_adj.
# Not a "retry after a null" -- close_adj vs close is a genuinely different price series
# (verified 2026-09-17: close != close_adj on ~70% of rows across the 80-ticker universe,
# both daily and 1h -- dividends/splits are common enough over 2020-2024 that this is a
# real data change, not cosmetic), and closing out this comparison on adjusted prices was
# explicitly planned before moving to sector-basket experiments.
#
# Pair with basket_gate_daily_adj_univariate.yaml: identical in every field except group_mode.
# Same McNemar-gate pairing requirement as every other Phase B config -- do not edit
# context_len/tickers/date range in one without mirroring it in the other.
stage_id: basket_gate_daily_adj_ctx35_multivariate
notes: >
  Phase B gate, close_adj rerun: does grouping many series for Chronos-2 to
  forecast JOINTLY (cross_learning=True) beat forecasting each independently,
  on dividend/split-adjusted prices? Same gate shape as the original (raw-close)
  Phase B, which FAILED 2026-09-17 (DA=0.484, 0/64 BH-significant). Gate passes
  iff aggregate ΔDA > 0 AND ≥1 BH-significant cell favoring multivariate AND
  multivariate still beats baselines.

data_source: algopack
algopack_processed_path: data_pipeline/data/processed/candles_1d/shares.parquet
price_col: close_adj
min_ticker_coverage: 0.9

group_mode: multivariate

interval: 24
date_from: "2020-01-03"
date_till: "2024-12-30"

tickers:
  - GAZP
  - SMLT
  - SBER
  - ROSN
  - MTSS
  - LKOH
  - T
  - OZON
  - PLZL
  - VTBR
  - YDEX
  - VKCO
  - GMKN
  - MAGN
  - AFKS
  - MGNT
  - PHOR
  - AFLT
  - IRAO
  - FEES
  - MDMG
  - LENT
  # 22 configured; min_ticker_coverage=0.9 drops LENT/MDMG/OZON/SMLT/VKCO/YDEX
  # on the raw-close run (verified 2026-09-17) -- left in rather than pre-trimmed
  # so a coverage-threshold change picks them back up automatically. Re-check the
  # actual drop log on this close_adj run rather than assuming it's identical.

indexes:        [IMOEX, MOEXOG, MOEXMM, MOEXFN, RGBI]
futures_proxies: [BR, Si, GD]

context_len: 35
horizon: 5
quantiles: [0.1, 0.5, 0.9]

walk_forward:
  shift: 1
  max_windows: 400

covariates: full

eval_horizons:    [1, 2, 3, 5]
primary_horizons: [2, 3, 5]
baselines: [zero, last, momentum5, ar1]

output_dir: runs
