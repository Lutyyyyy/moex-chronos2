# Phase B, close_adj follow-on — daily, univariate arm
# Mirrors basket_gate_daily_adj_multivariate.yaml exactly except group_mode. See that file's
# header for the full rationale (close_adj rollout, closing out daily/1h before sector
# baskets).
stage_id: basket_gate_daily_adj_univariate
notes: >
  Phase B gate, close_adj rerun: univariate arm (cross_learning=False), paired
  against basket_gate_daily_adj_multivariate for the McNemar gate test. Same gate
  shape as the original (raw-close) Phase B, which FAILED 2026-09-17.

data_source: algopack
algopack_processed_path: data_pipeline/data/processed/candles_1d/shares.parquet
price_col: close_adj
min_ticker_coverage: 0.9

group_mode: univariate

interval: 24
date_from: "2020-01-03"
date_till: "2024-12-30"

tickers:
  - GAZP
  - SMLT
  - SBER
  - ROSN
  - MTSS
  - LKOH
  - T
  - OZON
  - PLZL
  - VTBR
  - YDEX
  - VKCO
  - GMKN
  - MAGN
  - AFKS
  - MGNT
  - PHOR
  - AFLT
  - IRAO
  - FEES
  - MDMG
  - LENT
  # 22 configured; min_ticker_coverage=0.9 drops LENT/MDMG/OZON/SMLT/VKCO/YDEX
  # on the raw-close run (verified 2026-09-17) -- left in rather than pre-trimmed
  # so a coverage-threshold change picks them back up automatically. Re-check the
  # actual drop log on this close_adj run rather than assuming it's identical.

indexes:        [IMOEX, MOEXOG, MOEXMM, MOEXFN, RGBI]
futures_proxies: [BR, Si, GD]

context_len: 250
horizon: 5
quantiles: [0.1, 0.5, 0.9]

walk_forward:
  shift: 1
  max_windows: 400

covariates: full

eval_horizons:    [1, 2, 3, 5]
primary_horizons: [2, 3, 5]
baselines: [zero, last, momentum5, ar1]

output_dir: runs
