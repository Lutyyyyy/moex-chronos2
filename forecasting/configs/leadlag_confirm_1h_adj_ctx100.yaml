# CTX100 VARIANT: identical to leadlag_confirm_1h_adj.yaml except context_len: 100 (was 250). Middle data
# point for a LOG-SPACED 3-point context-length sweep: 35 -> 100 -> 250 (geometric
# midpoint of 35 and 250 is sqrt(35*250)~=93; 100 is the nearest round number, replacing
# an earlier context_len=60 choice that was closer to 35 than to 250 on a log scale --
# user's explicit correction 2026-09-18). Same bar count at daily and 1h (100 bars = ~20
# trading weeks daily, ~12.5 trading days at 1h) per the same bar-count-parity convention
# used for context_len=35/250 throughout this project. Existing (already-cached) date
# ranges comfortably support context_len=100 (verified: both the daily 2020-2024 range
# and the 1h 2024-05-27..2024-12-30 range support context_len up to 35 with room to
# spare, so 100 is also fine), so no new date range needed -- every other field unchanged
# from leadlag_confirm_1h_adj.yaml. NOTE: per the user's explicit sequencing, this batch is meant to run AFTER
# the main portfolio repo is pushed to GitHub, not before -- see docs/current_state.md
# session entry / the project plan file for context.
#
# Phase C (1h follow-on) — close_adj rerun, confirmation arm
# Runs Chronos-2 (group_mode: multivariate) ONLY on the 12 tickers that appear in the
# close_adj-rerun 1h discovery shortlist (residualized `pairwise_lagged_xcorr`, run
# 2026-09-17 on close_adj, discovery window 2023-01-02..2024-05-24 -- 9 BH-significant
# (pair, lag, direction) tests, q<0.05, well under the top_n=20 cap). Same discovery
# window/split as the original raw-close 1h run (archive/concluded_stages/
# phase_c_leadlag_1h_confirm.yaml), different shortlist (9 pairs vs 13, only partial
# overlap -- see scratch pad for the full table). Confirmation window strictly AFTER
# discovery (2024-05-27..2024-12-30, same 3-day gap as the original).
stage_id: leadlag_confirm_1h_adj_ctx100
notes: >
  1h-resolution lead-lag confirmation, close_adj rerun. Does Chronos-2
  (cross_learning=True) show real predictive skill, out-of-sample, on the
  specific ticker pairs that the close_adj 1h discovery screen flagged as
  BH-significant (q<0.05)? Per-pair success requires BH-significance WITHIN
  this confirmation run's own test family AND beating the `last` baseline.
  The original raw-close version of this test FAILED 2026-09-17 (0/13
  confirmed).

data_source: algopack
algopack_processed_path: data_pipeline/data/processed/candles_1h/shares.parquet
price_col: close_adj
min_ticker_coverage: 0.9

group_mode: multivariate

interval: 60
date_from: "2024-05-27"
date_till: "2024-12-30"

tickers:
  # Union of ticker_i/ticker_j from the close_adj 1h discovery shortlist (2026-09-17,
  # 9 BH-significant tests, q<0.05 -- see scratchpad for the full table).
  - BANEP
  - CHMF
  - FESH
  - HYDR
  - MGNT
  - MTSS
  - NMTP
  - SBER
  - SBERP
  - SNGSP
  - UPRO
  - VTBR

indexes:        [IMOEX, MOEXOG, MOEXMM, MOEXFN, RGBI]
futures_proxies: [BR, Si, GD]
# NOTE: indexes/futures_proxies come from the ISS live cache (not data_pipeline) at
# interval=60 -- already fetched for this exact date range by the original
# phase_c_leadlag_1h_confirm.yaml run, so this should hit local cache, not the network.

context_len: 100
horizon: 5
quantiles: [0.1, 0.5, 0.9]

walk_forward:
  shift: 1
  max_windows: 400

covariates: full

eval_horizons:    [1, 2, 3, 5]
primary_horizons: [2, 3, 5]
baselines: [zero, last, momentum5, ar1]

output_dir: runs
